name: apx
type: shell
sources:
  - type: tar
    url: https://github.com/Vanilla-OS/apx/releases/download/v2.5.0/apx-amd64.tar.gz
    checksum: fb00c7ca1796a45e3e41d3fa74be76cc36a86da5c4b7c8383519214e0d6b33d1
    only-arches: [amd64]
  - type: tar
    url: https://github.com/Vanilla-OS/apx/releases/download/v2.5.0/apx-arm64.tar.gz
    checksum: 786039f71b13b2e4c2131a1db6fa619b57958be1ab10a3e74405d7f3ae9c5436
    only-arches: [arm64]
commands:
- mkdir -p /usr/bin
- cp /sources/apx/apx*/apx /usr/bin/apx
- chmod +x /usr/bin/apx
modules:
- name: distrobox
  type: shell
  sources:
    - type: tar
      url: https://github.com/89luca89/distrobox/archive/refs/tags/1.8.2.2.tar.gz
      checksum: 0c797689c0b8c7c7c9fa53d1f5550657af95e64d8b8bbdc0fe374f341ebf6cd0
  commands:
  - mkdir -p /usr/share/apx
  - cp -r /sources/distrobox/1.8.2.2/distrobox-1.8.2.2 /usr/share/apx/distrobox
  - chmod +x /usr/share/apx/distrobox/distrobox*
  - sed -E -i 's/.*printf "distrobox.*/echo apx \$(echo ${container_name} | sed "s|apx-||") enter/g' /usr/share/apx/distrobox/distrobox-create
- name: apx-manpage
  type: shell
  sources:
    - type: tar
      url: https://github.com/Vanilla-OS/apx/releases/download/v2.5.0/apx-man.tar.gz
      checksum: d92244c2b1bd8698e7a68311c6838cbcbfaa035bf73259b37f63f53405f26034
  commands:
  - mv /sources/apx-manpage/apx-man/man/man1/apx.1 /usr/share/man/man1/
