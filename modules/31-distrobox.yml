name: distrobox
type: make
installCommand: make PREFIX=/usr install
sources:
  - type: git
    url: https://github.com/89luca89/distrobox.git
    tag: 2.0.0-rc.4
modules:
  - name: distrobox-deps-install
    type: apt
    sources:
      - packages:
          - golang-go
          - make
          - podman
  - name: distrobox-symlink
    type: shell
    commands:
      - mkdir -p /usr/share/apx/distrobox
      - ln -s /usr/bin/distrobox /usr/share/apx/distrobox/distrobox-enter
      - ln -s /usr/bin/distrobox-export /usr/share/apx/distrobox/
      - ln -s /usr/bin/distrobox-host-exec /usr/share/apx/distrobox/
      - ln -s /usr/bin/distrobox-init /usr/share/apx/distrobox/
