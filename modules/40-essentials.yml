name: essentials
type: apt
sources:
  - packages:
    - setserial
    - user-setup
    - console-setup
    - sudo
    - acpi
    - pkexec
    - bc
    - pcmciautils
    - samba-common-bin
    - laptop-detect
    - efibootmgr
    - shim-signed
    - minisign
    - zram-tools
    - grub-efi
  - packages:
    - grub-efi-amd64-signed
    only-arches: [amd64]
  - packages:
    - grub-efi-arm64-signed
    only-arches: [arm64]
